# golangci-lint configuration for the nram repo (v2 schema).
#
# Enables the standard high-signal linters repo-wide. errcheck catches
# unchecked errors, govet/staticcheck catch correctness and API misuse,
# ineffassign catches dead assignments, and unused catches dead symbols.
#
# History: this file previously enabled only a forbidigo "naked float
# literal" guard intended to keep operator-tunable magic numbers out of
# the dreaming/recall hot paths. That rule never fired; forbidigo matches
# identifiers and call expressions, not numeric literals, so it flagged
# e.g. uuid.New() while ignoring an adjacent 0.5 literal, and its path
# scoping used an invalid `issues.include-rules` key. Both were removed in
# the v2 migration. If the naked-float invariant needs real enforcement,
# the `mnd` (magic-number) linter scoped to internal/dreaming/phase_*.go
# and internal/service/recall.go is the correct tool.

version: "2"

run:
  go: "1.26"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      # Vendored JS dependencies ship Go sources (e.g. flatted) that are not
      # part of this module; never lint them.
      - ui/node_modules

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
