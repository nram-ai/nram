name: Bug report
description: Report something that is broken or behaving unexpectedly in nram.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The version field below is required so we can
        reproduce against the exact build you hit.

  - type: input
    id: version
    attributes:
      label: nram version / build
      description: >-
        Paste the version line. Get it from `GET /v1/health` (the `version` and `build.commit`
        fields), the API docs at `/docs`, or the bottom of the web console sidebar
        (e.g. `v0.1.0 · 604aeed`).
      placeholder: "v0.1.0 · 604aeed (or paste the full {version, build} JSON from /v1/health)"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Storage backend
      description: Which database backend is nram running against?
      options:
        - sqlite
        - postgres
        - not sure
    validations:
      required: true

  - type: input
    id: deployment
    attributes:
      label: Deployment / runtime
      description: How is nram running? OS, container, and how it was launched.
      placeholder: "e.g. Docker on Linux x86_64, single binary; or `make build` on macOS arm64"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug and what you expected instead.
      placeholder: |
        What I did:
        What I expected:
        What actually happened:
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, requests, or config to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: >-
        Relevant server logs, error responses, or stack traces. This is automatically
        formatted as code, so no backticks are needed.
      render: shell
    validations:
      required: false
