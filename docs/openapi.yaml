  # ── Admin: Providers ───────────────────────────────────────────────────
  /v1/admin/providers:
    get:
      operationId: adminGetProviders
      tags: [Admin - Providers]
      summary: Get current provider configuration
      responses:
        "200":
          description: Provider config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfigResponse"

  /v1/admin/providers/test:
    post:
      operationId: adminTestProvider
      tags: [Admin - Providers]
      summary: Test a provider connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderTestRequest"
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTestResult"

  /v1/admin/providers/{slot}:
    put:
      operationId: adminUpdateProviderSlot
      tags: [Admin - Providers]
      summary: Update a provider slot
      parameters:
        - name: slot
          in: path
          required: true
          schema:
            type: string
            enum: [embedding, fact, entity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderSlotConfig"
      responses:
        "200":
          description: Slot updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /v1/admin/providers/ollama/models:
    get:
      operationId: adminListOllamaModels
      tags: [Admin - Providers]
      summary: List available Ollama models
      description: >-
        Lists models on the Ollama server. In-progress custom provider headers
        (for a proxied Ollama server not yet saved) may be forwarded as request
        headers prefixed `X-Nram-Provider-Header-<Name>`; this keeps secret
        values out of the URL query string. When none are supplied, the headers
        persisted on the matching Ollama slot are used.
      parameters:
        - name: url
          in: query
          required: false
          schema:
            type: string
          description: Override Ollama base URL; defaults to the configured/known Ollama slot.
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OllamaModel"

  /v1/admin/providers/models:
    get:
      operationId: adminListProviderModels
      tags: [Admin - Providers]
      summary: List models served by an OpenAI-compatible endpoint
      description: >-
        Lists the model ids an OpenAI-compatible server reports at `GET
        /v1/models`. Used to detect the served model for vLLM/SGLang slots
        (single-model servers) so the operator does not have to hand-type an id
        that must match the server's `--served-model-name`. In-progress custom
        provider headers (for a proxied/authenticated endpoint not yet saved) may
        be forwarded as request headers prefixed `X-Nram-Provider-Header-<Name>`,
        keeping secret values out of the URL query string; when none are supplied,
        the headers and API key persisted on a saved slot with the same URL are
        used.
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: Base URL of the OpenAI-compatible server to probe.
      responses:
        "200":
          description: Model id list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /v1/admin/providers/ollama/pull:
    post:
      operationId: adminPullOllamaModel
      tags: [Admin - Providers]
      summary: Pull an Ollama model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model:
                  type: string
                url:
                  type: string
                  description: Override Ollama base URL.
                custom_headers:
                  type: object
                  description: >-
                    In-progress custom headers to attach to the pull request
                    (e.g. proxy auth). Falls back to the matching Ollama slot's
                    persisted headers when omitted.
                  additionalProperties:
                    type: string
      responses:
        "202":
          description: Pull accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: accepted
                  model:
                    type: string

  # ── Admin: Settings ────────────────────────────────────────────────────
  /v1/admin/settings:
    get:
      operationId: adminListSettings
      tags: [Admin - Settings]
      summary: List settings or get schema definitions
      description: |
        Without ?schema=true: returns paginated settings list (with pagination object).
        With ?schema=true: returns setting definitions (data array only, no pagination).
      parameters:
        - name: scope
          in: query
          schema:
            type: string
        - name: schema
          in: query
          description: Set to "true" to get setting definitions
          schema:
            type: string
            enum: ["true"]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Settings list or schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/Setting"
                        - $ref: "#/components/schemas/SettingSchema"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

    put:
      operationId: adminUpdateSetting
      tags: [Admin - Settings]
      summary: Update a setting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  $ref: "#/components/schemas/SettingKey"
                value: {}
                scope:
                  type: string
                  default: global
      responses:
        "200":
          description: Setting updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

