      type: object
      required: [type, sample_input]
      properties:
        type:
          type: string
          enum: [fact, entity, augment, ingestion]
        system_prompt:
          type: string
          description: >-
            Tunable instruction sent as the system message. Empty falls back to
            the phase's registered system-prompt default. The dynamic user
            message is built from the phase's hardcoded code wrapper applied to
            sample_input.
        sample_input:
          type: string
        count:
          type: integer
          description: Number of queries to generate; only used when type is "augment" (default 4).

