          in: query
          description: Export format.
          schema:
            type: string
            enum: [json, csv]
        - name: level
          in: query
          schema:
            type: string
        - name: component
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Log export as an attachment
          content:
            application/json:
              schema:
                type: array
                items:
