  /v1/me/memories/recall:
    post:
      operationId: meRecall
      tags: [User]
      summary: User-scoped memory recall (across all user projects)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecallRequest"
      responses:
        "200":
          description: Recall results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/me/memories/ask:
    post:
      operationId: meAsk
      tags: [User]
      summary: Synthesize one answer over the user's memories (ask tool)
      description: >-
        Gated behind the ask.enabled feature flag; returns 404 when the feature
        is disabled. With no project in the body, synthesizes over the caller's
        wide aperture (every owned project plus global and about_me); with a
        project slug, narrows to that project plus global and about_me.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: Synthesized answer with cited sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: The ask synthesis provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/me/projects:
    get:
      operationId: meListProjects
      tags: [User]
      summary: List authenticated user's projects
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated project list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProjects"

    post:
      operationId: meCreateProject
      tags: [User]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Slug conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/me/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: meGetProject
      tags: [User]
      summary: Get a project
      description: Retrieve a project by ID. Only the project owner can view their own projects.
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          description: Not the project owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: meUpdateProject
      tags: [User]
      summary: Update a project
      description: Update a project's name, slug, description, default tags, or settings. Only the project owner can update their own projects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                default_tags:
                  type: array
                  items:
                    type: string
                settings:
                  type: object
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Not the project owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: meDeleteProject
      tags: [User]
      summary: Delete a project
      description: >-
        Permanently delete a project and all its memories, entities, relationships,
        and vectors. Only the project owner can delete their own projects. The
        'global' project cannot be deleted. Token usage records are preserved by
        reassigning them to the global project.
      responses:
        "204":
          description: No Content
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Not the project owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

