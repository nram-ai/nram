            or metadata-only update this matches the path id.
        previous_memory_id:
          type: string
          format: uuid
          description: |
            Always echoes the path id. On a content change this points at
            the now-superseded ancestor; on an in-place update it equals
            `id`.
        project_id:
          type: string
          format: uuid
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        previous_content:
          type: string
        re_embedded:
          type: boolean
        superseded:
          type: boolean
          description: |
