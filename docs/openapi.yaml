        disable_thinking:
          type: boolean
          description: >-
            The slot's stored "disable thinking" toggle. Absent means unset
            (resolved to disabled server-side).
        rerank_method:
          type: string
          enum: [cross_encoder, judge]
          description: >-
            Reranker slot only: the auto-detected implementation, probed by the
            backend at save/test time. cross_encoder uses a deterministic
            /v1/rerank endpoint; judge prompts a chat model per candidate. Absent
            for other slots and for a reranker slot never probed.

    ProviderTestRequest:
      type: object
      required: [slot, config]
      properties:
        slot:
          type: string
          enum: [embedding, fact, entity]
        config:
          $ref: "#/components/schemas/ProviderSlotConfig"

    ProviderSlotConfig:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: >-
            Provider type. One of openai, ollama, gemini, anthropic, openrouter,
            openai-compatible, vllm, sglang, llama-server.
            openai/ollama/openrouter/openai-compatible/vllm/sglang/llama-server
            share the OpenAI-compatible adapter; llama-server is llama.cpp's
            llama-server and, like vllm and sglang, supports model auto-detection
            via GET /v1/models. The legacy value "custom" is accepted and
            normalized to openai-compatible. See disable_thinking for the
            per-slot reasoning-pass control.
        url:
          type: string
        api_key:
          type: string
          description: >-
            API key for the provider. Optional: a slot may authenticate purely
            via a custom header (e.g. a fronting proxy). On update, a blank value
            preserves the stored key; use clear_api_key to drop it.
        model:
          type: string
        dimensions:
          type: integer
        timeout:
          type: integer
          description: Request timeout in seconds (0 = default 300s).
        custom_headers:
          type: object
          description: >-
            Arbitrary HTTP headers attached to every outbound request to this
            slot's provider host (inference, embeddings, health pings, and the
            Ollama/OpenRouter auxiliary calls). Intended for proxies/gateways.
            On update the map is the new full set (omitted names are removed); a
            header sent with a blank value keeps its previously stored value.
            Content-Type (and, for Anthropic, anthropic-version) are reserved and
            cannot be overridden.
          additionalProperties:
            type: string
        extra_body:
          type: object
          description: >-
            Merged onto the top level of every OpenAI-compatible request body
            (chat completions and embeddings), mirroring the OpenAI SDK's
            extra_body. Primary use is chat_template_kwargs:{enable_thinking:false}
            on a self-hosted vLLM/SGLang slot, but any key is allowed; user keys
            override anything the provider type set. On update the map is the new
            full set (omitted keys are removed). Ignored by the Gemini and
            Anthropic adapters.
          additionalProperties: true
        disable_thinking:
          type: boolean
          description: >-
            Whether nram sends the provider-appropriate "thinking off" knob on
            this slot's completions (Ollama reasoning_effort:none, OpenRouter
            reasoning.enabled:false, vLLM/SGLang/llama-server
            chat_template_kwargs.enable_thinking:false, Gemini
            thinkingConfig.thinkingBudget:0 on the 2.5 Flash family). Omitted/unset
            resolves to true (disabled), so existing slots keep skipping the
            reasoning pass. Inert for openai, anthropic, and openai-compatible,
            where an explicit disable would 400 on current models. On the reranker
            slot it is dropped on save unless the probed method is "judge": only
            the generative judge completes, so a value stored against a
            cross-encoder would be dead config nothing emits.
        rerank_method:
          type: string
          enum: [cross_encoder, judge]
          description: >-
            Reranker slot only. Selects the rerank implementation. Normally left
            unset: the save/test path probes the server and fills it
            (cross_encoder when /v1/rerank answers, judge otherwise). The probe is
            authoritative: on save a reachable server's detected method always
            overwrites any supplied value. A supplied value is used only as a
            fallback when the probe cannot reach the server, so a
            configure-before-the-server-is-up save is not blocked; it never
            overrides a successful probe.
        clear_api_key:
          type: boolean
          description: >-
            Request-only flag (update endpoint). When true, the stored api_key is
            cleared instead of preserved-on-blank.

    ProviderTestResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        latency_ms:
          type: integer
          format: int64
        rerank_method:
          type: string
          enum: [cross_encoder, judge]
          description: >-
            Rerank method detected by the probe. Reranker slot only; absent for
            every other slot.
        calibration:
          allOf:
            - $ref: "#/components/schemas/RerankJudgeCalibration"
          description: >-
            Present only when rerank_method is "judge".

    RerankJudgeCalibration:
      type: object
      description: >-
        Result of driving the LLM-judge rerank path against a fixed known-answer
        pair. The method probe alone only proves the server did not answer
        POST /v1/rerank; whether the chat model behind it emits a usable relevance
        number fails silently, so the test runs the judge for real and reports the
        scores it produced.
      properties:
        calibrated:
          type: boolean
          description: >-
            Whether some configuration produced parseable scores that
            discriminated (relevant strictly above irrelevant). When false, only
            diagnosis and last_output are meaningful.
        disable_thinking:
          type: boolean
          description: >-
            The winning configuration's thinking setting. Returned rather than
            written: the test may be running against an unsaved form, so the UI
            applies it to the slot's toggle and the operator's save persists it.
        max_tokens:
          type: integer
          description: The winning per-candidate token cap.
        max_tokens_applied:
          type: boolean
          description: >-
            Whether the test wrote max_tokens back to the global
            ranking.rerank.judge.max_tokens setting. It does so only when the
            winning value differs from the stored one; that setting has no
            slot-level field, which is why the server writes it directly.
        relevant_score:
          type: number
          format: double
        irrelevant_score:
          type: number
          format: double
        diagnosis:
          type: string
          description: Operator-facing explanation of a failed calibration.
        last_output:
          type: string
          description: Raw completion behind a non-numeric failure.

    OllamaModel:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
          format: int64
        modified_at:
          type: string

