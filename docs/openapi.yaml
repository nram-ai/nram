    EnrichmentQueueStatus:
      type: object
      properties:
        counts:
          type: object
          properties:
            pending:
              type: integer
            processing:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              memory_id:
                type: string
                format: uuid
              status:
                type: string
              attempts:
                type: integer
              last_error:
                type: string
              created_at:
                type: string
                format: date-time
              facet_count:
                type: integer
                description: >-
                  Number of multi-vector facets the facet pass produced for this
                  memory (1 = single topic / whole-memory vector only, N =
                  whole-memory vector plus N-1 topic facets). Omitted when the
                  memory has not been faceted yet, or the row predates the
                  feature.
              phase_metrics:
                type: array
                description: >-
                  Per-phase LLM/embedding latency and token usage for this
                  job's most recent run, read from the recorded token_usage
                  rows. Omitted when no usage rows match the memory (e.g. a
                  pending job, a skipped phase, or a row predating the feature).
                items:
                  $ref: "#/components/schemas/EnrichmentPhaseMetric"
        paused:
          type: boolean

    EnrichmentPhaseMetric:
      type: object
      description: One enrichment phase's measured LLM/embedding cost.
      properties:
        operation:
          type: string
          description: >-
            Canonical provider operation name, e.g. ingestion_decision,
            fact_extraction, entity_extraction, query_augment, embedding.
        model:
