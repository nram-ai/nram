  /v1/admin/logs:
    get:
      operationId: adminListLogs
      tags: [Admin - Logs]
      summary: List captured diagnostic log entries (paginated, filtered)
      parameters:
        - name: level
          in: query
          description: Comma-separated set of levels (debug, info, warn, error).
          schema:
            type: string
        - name: component
          in: query
          schema:
            type: string
        - name: search
          in: query
          description: Case-insensitive substring match on the message.
          schema:
            type: string
        - name: attr_key
          in: query
          description: Structured attribute key to match (used with attr_value).
          schema:
            type: string
        - name: attr_value
          in: query
          schema:
            type: string
        - name: from
          in: query
          description: RFC3339 lower bound on the entry timestamp.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: RFC3339 upper bound on the entry timestamp.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: A page of log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LogEntry"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

