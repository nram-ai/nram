        stripped from metadata on the recall path; the full metadata remains
        available via the memory detail endpoint.
      properties:
        id:
          type: string
          format: uuid
        project_slug:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        source:
          type: [string, "null"]
        origin:
          type: string
          enum: [user, dream, import]
          readOnly: true
          description: |
            Server-assigned provenance category and the authoritative
            dream-synthesis discriminator. Never accepted as client input.
        score:
          type: number
          format: double
        confidence:
          type: number
          format: double
        low_novelty:
          type: boolean
          description: |
            True when the dream novelty audit demoted this memory (paired with
            confidence 0). Always present.
        derived_from:
          type: array
          description: |
            Source memory IDs this memory was synthesized from (dream lineage).
            Omitted when the memory has no lineage.
          items:
            type: string
            format: uuid
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RecallEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string

    BulkForgetRequest:
