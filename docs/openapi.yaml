        origin:
          type: string
          enum: [user, dream, import]
          readOnly: true
          description: |
            Server-assigned provenance category and the authoritative
            dream-synthesis discriminator. Never accepted as client input.
        metadata:
          type: object
        enriched:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AskRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: The question to answer from the caller's memories.
        project:
          type: string
          description: >-
            Optional project slug. Omit for a wide cross-project synthesis over
            all of the caller's projects (plus global and about_me); supply a
            slug to scope to that project plus global and about_me. Ignored on
            the project-scoped endpoint, which takes the project from the path.

    AskResponse:
      type: object
      required: [answer, sources, confidence, synthesis_meta]
      properties:
        answer:
          type: string
          description: >-
            The synthesized answer as clean prose with inline footnote citations
            ([1], [2], …) that map to the `citation` field on each source. Empty
            when synthesis_meta.synthesis_failed is true.
        sources:
          type: array
          description: >-
            When the answer cited sources, this is the cited memories in
            footnote order (each with its `citation` number). On the uncited
            fallback (synthesis failure or "not in neighborhood") it is the
            retrieved candidates with `citation` omitted.
          items:
            type: object
            required: [memory_id, project_slug]
            properties:
              memory_id:
                type: string
                format: uuid
              project_slug:
                type: string
              score:
                type: number
                format: double
                description: >-
                  The source's absolute vector cosine to the query. Omitted for
                  sources that entered via graph or sibling expansion (no direct
                  query match) rather than reporting a misleading 0.
              citation:
                type: integer
                description: >-
                  Footnote number ([1], [2], …) this source carries inline in
                  the answer. Omitted on the uncited fallback.
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >-
            A grounding / evidence-strength signal, not a correctness or
            faithfulness probability. Derived from the calibrated vector cosines
            of the recall sources the answer actually cited, scaled by how many
            it corroborated against (not the model's self-assessment): a high
            value means the cited sources are strong matches for the query. It
            does not measure whether the answer is right: an answer can be
            confident yet wrong if it drew a wrong conclusion from a
            strong-matching source. Zero when the answer cited no recall source:
            it was ungrounded, said "Not in neighborhood.", or synthesis failed.
        synthesis_meta:
          type: object
          required: [latency_ms, neighborhood_size]
          properties:
            latency_ms:
              type: integer
              format: int64
            neighborhood_size:
              type: integer
            synthesis_failed:
              type: boolean
              description: >-
                True when the synthesizer call failed; the response then carries
                the recalled sources with an empty answer instead of erroring.

    RecallRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        limit:
          type: integer
        threshold:
          type: number
          format: double
          description: >-
            Composite ranking-score floor (not raw vector similarity). Filters
            on the weighted sum of similarity, recency, importance, frequency,
            graph relevance, confidence, and origin (frequency and origin are
            zero-weighted by default; operators can re-weight them via the
            ranking_weights settings). Use `similarity_threshold` to filter on
            vector evidence directly.
        similarity_threshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >-
            Vector-evidence cutoff (must be in [0, 1]; 0 disables,
            out-of-range returns 400). Filters candidates by raw cosine
            from the vector store (raw_cosine mode) or by post-RRF
            max-normalized similarity (fused_combined mode). List-fallback
            and shared-namespace candidates ALWAYS pass through
            unfiltered regardless of mode.
        similarity_threshold_mode:
          type: string
          enum: [raw_cosine, fused_combined]
          default: raw_cosine
          description: >-
            Which similarity value `similarity_threshold` compares
            against. `raw_cosine` (default) compares the raw cosine
            returned by the vector store before RRF on an absolute
            scale; only vector-channel rows are filtered, so
            lexical-only hits and non-vector candidates pass through.
            `fused_combined` compares the post-RRF max-normalized
            similarity and filters every simMap entry (including
            lexical-only entries whose normalized score reflects
            combined evidence); list-fallback and shared-namespace
            candidates still bypass. fused_combined is rank-relative:
            post-RRF scores are normalized so the top result for a
            given query is always 1.0, so the threshold's selectivity
            floats with query difficulty. fused_combined requires
            recall.fusion.enabled=true; combining it with a non-zero
            threshold while fusion is disabled returns 400.
        tags:
          type: array
          items:
            type: string
        include_graph:
          type: boolean
          default: false
        graph_depth:
          type: integer

    RecallResponse:
      type: object
      properties:
        memories:
          type: array
          items:
            $ref: "#/components/schemas/RecallResult"
        graph:
          type: object
          properties:
            entities:
              type: array
              items:
