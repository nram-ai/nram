        custom_header_keys:
          type: array
          description: >-
            Names of the custom HTTP headers configured for this slot, sorted.
            Values are never returned because they may carry secrets.
          items:
            type: string
        extra_body:
          type: object
          description: >-
            The slot's configured extra_body, returned verbatim (values are not
