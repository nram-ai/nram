                      $ref: "#/components/schemas/APIKey"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

    post:
      operationId: adminGenerateApiKey
      tags: [Admin - Users]
      summary: Generate an API key for a user
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                    format: uuid
                expires_at:
                  type: string
                  format: date-time
      responses:
        "201":
          description: API key generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGenerateAPIKeyResponse"

