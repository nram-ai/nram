            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentRetryResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/enrichment/pause:
    post:
      operationId: adminPauseEnrichment
      tags: [Enrichment]
      summary: Pause or resume enrichment workers (administrator only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paused]
              properties:
                paused:
                  type: boolean
      responses:
        "200":
          description: Pause state
          content:
            application/json:
              schema:
                type: object
                properties:
                  paused:
                    type: boolean
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/enrichment/test-prompt:
    post:
      operationId: adminTestEnrichmentPrompt
      tags: [Enrichment]
      summary: Test an enrichment prompt against an LLM (administrator only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichmentTestPromptRequest"
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentTestPromptResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/enrichment/backfill-augmentation:
    post:
      operationId: adminBackfillAugmentation
      tags: [Enrichment]
      summary: Backfill query-augmentation for older memories (administrator only)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichmentBackfillRequest"
      responses:
        "200":
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentBackfillResponse"

  /v1/admin/enrichment/backfill-multi-vector:
    post:
      operationId: adminBackfillMultiVector
      tags: [Enrichment]
      summary: Backfill multi-vector facets for existing memories (administrator only)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichmentBackfillRequest"
      responses:
        "200":
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentBackfillResponse"

  /v1/admin/enrichment/backfill-extracted-fact-paraphrase:
    post:
      operationId: adminBackfillFactParaphrase
      tags: [Enrichment]
      summary: Backfill extracted-fact paraphrases (administrator only)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichmentBackfillRequest"
      responses:
        "200":
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentBackfillResponse"

  /v1/admin/enrichment/backfill-missing-embeddings:
    post:
      operationId: adminBackfillMissingEmbeddings
      tags: [Enrichment]
      summary: Re-embed memories that have no stored vector (administrator only)
      description: >
        Re-enqueues embedding-stranded memories (live, embeddable, no stored
        vector) so the worker re-embeds them, restoring vector recall. Runs off
        the queue, independent of dreaming. dry_run returns the candidate count
        without enqueueing.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichmentBackfillRequest"
      responses:
        "200":
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentBackfillResponse"

  /v1/admin/enrichment/backfill-consolidation-entities:
    post:
      operationId: adminBackfillConsolidationEntities
      tags: [Enrichment]
      summary: Extract entities for consolidation dreams lacking coverage (administrator only)
      description: >
        Enqueues an entity-only enrichment job (fact extraction skipped, so no
        child memories spawn) for every active consolidation dream that still has
        no sourced relationship, recovering entity-graph coverage stranded before
        dreams were extracted. The dreaming consolidation-entity backfill phase
        does this automatically each cycle; this is the on-demand path. dry_run
        returns the candidate count without enqueueing.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichmentBackfillRequest"
      responses:
        "200":
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentBackfillResponse"

  /v1/admin/enrichment/clear-completed-jobs:
    post:
      operationId: adminClearCompletedJobs
      tags: [Enrichment]
      summary: Delete completed enrichment queue rows (administrator only)
      description: >
        Deletes completed enrichment_queue rows so the queue view stays
        readable. Scoped strictly to completed jobs; pending and processing rows
        are never touched. older_than_days 0 clears all completed rows.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                older_than_days:
                  type: integer
                  minimum: 0
                  description: Keep rows completed within this many days; 0 clears all.
      responses:
        "200":
          description: Number of completed rows deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer

  # ── Admin: dreaming (system-ops) ────────────────────────────────────────
  /v1/admin/dreaming:
    get:
      operationId: adminGetDreaming
      tags: [Dreaming]
      summary: Cross-tenant dreaming status (administrator only)
      responses:
        "200":
          description: Dreaming status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DreamStatusResponse"

  /v1/admin/dreaming/cycles:
    get:
      operationId: adminListDreamCycles
      tags: [Dreaming]
      summary: Cross-tenant dream cycles (administrator only)
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dream cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DreamCycle"

  /v1/admin/dreaming/cycles/{id}:
    get:
      operationId: adminGetDreamCycle
      tags: [Dreaming]
      summary: Cross-tenant dream cycle detail with logs (administrator only)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Dream cycle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DreamCycleDetail"

  /v1/admin/dreaming/cycles/{id}/abandon:
    post:
      operationId: adminAbandonDreamCycle
      tags: [Dreaming]
      summary: Abandon a stuck dream cycle (administrator only)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Abandon result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DreamCycleActionResult"

  /v1/admin/dreaming/enable:
    post:
      operationId: adminEnableDreaming
      tags: [Dreaming]
      summary: Enable or disable the dreaming pipeline (administrator only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Enable state
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean

  /v1/admin/dreaming/rollback:
    post:
      operationId: adminRollbackDreaming
      tags: [Dreaming]
      summary: Roll back a dream cycle by ID (administrator only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycle_id]
              properties:
                cycle_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Rollback result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DreamCycleActionResult"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: JWT token or API key (prefixed with nram_k_)

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgId:
      name: org_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Organization ID
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Export job ID
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "Forbidden: insufficient role or org membership"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ── Error ──────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, forbidden, not_found, conflict, rate_limited, internal_error]
            message:
              type: string
            details:
              type: object

    # ── Core Models ────────────────────────────────────────────────────
    Memory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        namespace_id:
          type: string
          format: uuid
        content:
          type: string
        embedding_dim:
          type: [integer, "null"]
        source:
          type: [string, "null"]
        origin:
          type: string
          enum: [user, dream, import]
          readOnly: true
          description: |
            Server-assigned provenance category and the authoritative
            dream-synthesis discriminator. Never accepted as client input.
        tags:
          type: array
          items:
            type: string
        confidence:
          type: number
          format: double
        importance:
          type: number
          format: double
        access_count:
          type: integer
        last_accessed:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        superseded_by:
          type: [string, "null"]
          format: uuid
        enriched:
          type: boolean
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, "null"]
          format: date-time
        purge_after:
          type: [string, "null"]
          format: date-time

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        org_id:
          type: string
          format: uuid
        namespace_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/UserRole"
        settings:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login:
          type: [string, "null"]
          format: date-time
        disabled_at:
          type: [string, "null"]
          format: date-time

    UserRole:
      type: string
      enum: [administrator, org_owner, member, readonly, service]

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        namespace_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        settings:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        namespace_id:
          type: string
          format: uuid
        owner_namespace_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        default_tags:
          type: array
          items:
            type: string
        settings:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        key_prefix:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            format: uuid
        last_used:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    OAuthClient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
        name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
        org_id:
          type: [string, "null"]
          format: uuid
        user_id:
          type: [string, "null"]
          format: uuid
        auto_registered:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time

    OAuthIdPConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: [string, "null"]
          format: uuid
        provider_type:
          type: string
        client_id:
          type: string
        issuer_url:
          type: [string, "null"]
        allowed_domains:
          type: array
          items:
            type: string
        auto_provision:
          type: boolean
        default_role:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Webhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        scope:
          type: string
        active:
          type: boolean
        last_fired:
          type: [string, "null"]
          format: date-time
        last_status:
          type: [integer, "null"]
        failure_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Setting:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/SettingKey"
        value: {}
        scope:
          type: string
        updated_by:
          type: [string, "null"]
          format: uuid
        updated_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # ── Health ─────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        build:
          # VCS build provenance, stamped by the Go toolchain at build time.
          # commit is "unknown" for builds without a VCS stamp.
          type: object
          properties:
            commit:
              type: string
            dirty:
              type: boolean
            time:
              type: string
              format: date-time
            go:
              type: string
        backend:
          type: string
          enum: [sqlite, postgres]
        database:
          type: object
          properties:
            status:
              type: string
              enum: [ok, error]
            latency_ms:
              type: integer
              format: int64
        providers:
          # Keyed by canonical provider-slot name (internal/provider/slots.go).
          # One entry per slot; optional slots report their fallback-resolved
          # status. Kept in sync with provider.Slots by an automated test.
          type: object
          properties:
            embedding:
              $ref: "#/components/schemas/HealthProviderStatus"
            fact:
              $ref: "#/components/schemas/HealthProviderStatus"
            entity:
              $ref: "#/components/schemas/HealthProviderStatus"
            query_augment:
              $ref: "#/components/schemas/HealthProviderStatus"
            ingestion_decision:
              $ref: "#/components/schemas/HealthProviderStatus"
            ask:
              $ref: "#/components/schemas/HealthProviderStatus"
            reranker:
              $ref: "#/components/schemas/HealthProviderStatus"
        enrichment_queue:
          type: [object, "null"]
          properties:
            pending:
              type: integer
            processing:
              type: integer
            failed:
              type: integer
        uptime_seconds:
          type: integer
          format: int64

    HealthProviderStatus:
      type: object
      properties:
        status:
          type: string
        provider:
          type: string
        model:
          type: string
        latency_ms:
          type: [integer, "null"]
          format: int64

    # ── Setup ──────────────────────────────────────────────────────────
    SetupStatusResponse:
      type: object
      properties:
        setup_complete:
          type: boolean
        backend:
          type: string
          enum: [sqlite, postgres]
        onboarding_complete:
          type: boolean
          description: >-
            Whether the guided first-run onboarding wizard has been finished or
            opted out of. False only between account creation and wizard
            completion on a fresh install; legacy installs report true.
        onboarding_step:
          type: string
          description: Persisted onboarding wizard step cursor ("" when never advanced).

    OnboardingProgressRequest:
      type: object
      properties:
        step:
          type: string
          description: The wizard step cursor to persist.
        complete:
          type: boolean
          description: When true, marks onboarding finished.

    SetupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    SetupResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        api_key:
          type: string
        token:
          type: string
        message:
          type: string

    # ── Auth ───────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            display_name:
              type: string
            role:
              $ref: "#/components/schemas/UserRole"
            org_id:
              type: string
              format: uuid

    # ── OAuth ──────────────────────────────────────────────────────────
    JWK:
      type: object
      description: A JSON Web Key (RFC 7517) for an EC public key.
      properties:
        kty:
          type: string
          example: EC
        crv:
          type: string
          example: P-256
        x:
          type: string
          description: base64url-encoded x coordinate.
        y:
          type: string
          description: base64url-encoded y coordinate.
        use:
          type: string
          example: sig
        alg:
          type: string
          example: ES256
        kid:
          type: string
          description: RFC 7638 JWK thumbprint.

    JWKS:
      type: object
      description: A JSON Web Key Set (RFC 7517).
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/JWK"

    InstanceIdentity:
      type: object
      description: This deployment's persistent instance identity. The private key is never included.
      properties:
        instance_id:
          type: string
          format: uuid
        algorithm:
          type: string
          example: ES256
        public_key_pem:
          type: string
          description: PKIX/SPKI PEM encoding of the instance public key.
        public_key_jwk:
          $ref: "#/components/schemas/JWK"
        created_at:
          type: string
          format: date-time

    OAuthServerMetadata:
      type: object
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        registration_endpoint:
          type: string
        userinfo_endpoint:
          type: string
        jwks_uri:
          type: string
          description: URL of the JWK Set exposing the instance public signing key.
        instance_id:
          type: string
          format: uuid
          description: This deployment's persistent instance UUID (non-standard field).
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string

    OAuthProtectedResourceMetadata:
      type: object
      properties:
        resource:
          type: string
        authorization_servers:
          type: array
          items:
            type: string
        bearer_methods_supported:
          type: array
          items:
            type: string

    OAuthTokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token]
        code:
          type: string
        redirect_uri:
          type: string
          format: uri
        client_id:
          type: string
        client_secret:
          type: string
          description: Required for confidential clients using client_secret_post authentication
        code_verifier:
          type: string
        refresh_token:
          type: string

    OAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        refresh_token:
          type: string

    OAuthErrorResponse:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string

    OAuthClientRegistrationRequest:
      type: object
      required: [client_name, redirect_uris]
      properties:
        client_name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string

    OAuthClientRegistrationResponse:
      type: object
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        client_name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string

    OAuthUserInfoResponse:
      type: object
      properties:
        sub:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
        org_id:
          type: string

    # ── Memory Operations ──────────────────────────────────────────────
    StoreMemoryRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        source:
          type: string
          description: |
            Free-form provenance label. The value "dream" is reserved for the
            consolidation cycle and is rejected with a validation error; the
            server assigns provenance via the read-only `origin` field instead.
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
        options:
          type: object
          properties:
            enrich:
              type: boolean
              default: false
            extract:
              type: boolean
              default: false
            ttl:
              type: string
              description: Duration string (e.g. "30d", "7d", "24h")

    StoreMemoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
