    ProviderSlotStatus:
      type: object
      properties:
        configured:
          type: boolean
        type:
          type: string
        url:
          type: string
        model:
          type: string
        dimensions:
          type: [integer, "null"]
        status:
          type: string
        latency_ms:
          type: [integer, "null"]
          format: int64
        api_key_set:
          type: boolean
          description: >-
            Whether a non-empty api_key is stored for this slot. The key value is
