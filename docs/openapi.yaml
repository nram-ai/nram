openapi: 3.1.0
info:
  title: Neural Ram API
  description: |
    Neural Ram, persistent memory layer for AI agents.

    This document covers the HTTP/JSON REST surface. The following non-JSON
    transports are served by the same binary but intentionally not modeled
    here: the MCP Streamable HTTP endpoint at `/mcp`, the Server-Sent Events
    stream at `/v1/events`, Prometheus metrics at `/metrics`, and the HTML
    consent/landing shells served by `GET /authorize` and `GET /share/accept`.
    See docs/api.md for those.
  version: 0.18.43
  license:
    name: MIT

servers:
  - url: http://localhost:8674
    description: Local development

tags:
  - name: Health
    description: System health and status
  - name: Setup
    description: Initial server setup
  - name: Auth
    description: Authentication endpoints
  - name: OAuth
    description: OAuth 2.0 Authorization Code + PKCE flow
  - name: Memories
    description: Project-scoped memory CRUD
  - name: User
    description: User-scoped (self-service) endpoints
  - name: Dashboard
    description: "Dashboard and activity, scoped by role"
  - name: Admin - Organizations
    description: Admin organization management
  - name: Admin - Users
    description: Admin user management
  - name: Admin - Providers
    description: LLM/embedding provider configuration
  - name: Admin - Settings
    description: System settings
  - name: Admin - Webhooks
    description: Webhook management
  - name: Enrichment
    description: "Enrichment queue: read for all, writes admin-only"
  - name: Analytics
    description: "Memory analytics, scoped by role"
  - name: Usage
    description: "Token usage reporting, scoped by role"
  - name: Namespaces
    description: "Namespace hierarchy, scoped by role"
  - name: Admin - Database
    description: Database info and migration
  - name: Graph
    description: "Knowledge graph visualization, scoped by role"
  - name: Admin - OAuth
    description: OAuth client and IdP management
  - name: Org - Users
    description: "Org-scoped user management (org_owner+)"
  - name: Org - IdP
    description: "Org-scoped IdP configuration (org_owner+)"
  - name: Org - Dashboard
    description: "Org-scoped dashboard, activity, dreaming and enrichment (org_owner+)"
  - name: Procedural
    description: User-scoped procedural (standing-instruction) entries
  - name: Account
    description: "Self-service profile, password, passkeys, capabilities"
  - name: Exports
    description: User-scoped asynchronous export jobs
  - name: Shares
    description: User-scoped share-token management
  - name: Dreaming
    description: "Dreaming (memory consolidation) pipeline, scoped by role"
  - name: Admin - System
    description: "System-aggregate dashboards (administrator only)"
  - name: Admin - Graph
    description: "Knowledge-graph maintenance (administrator only)"
  - name: Meta
    description: API metadata

security:
  - BearerAuth: []

paths:
  # ── Health ──────────────────────────────────────────────────────────────
  /v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: System health check
      security: []
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /openapi.yaml:
    get:
      operationId: getOpenAPISpec
      tags: [Meta]
      summary: This OpenAPI specification (served from the binary)
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string

  /instructions:
    get:
      operationId: getInstructions
      tags: [Meta]
      summary: Canonical agent memory-usage instructions/rules (plain text)
      description: >
        Returns the nram memory-usage guidance as plain text. This is the
        single source of truth rendered on the MCP config page and consumed by
        external callers. The format query selects the flavor.
      security: []
      parameters:
        - name: format
          in: query
          required: false
          description: >
            Flavor of the guidance. "claude" and "agents" return the same full
            markdown body; "condensed" returns the length-limited rules copy for
            surfaces that cap the field length (e.g. ChatGPT Custom
            instructions); "cursor" is a deprecated alias of "condensed".
            Defaults to the full body.
          schema:
            type: string
            enum: [claude, agents, condensed, cursor]
            default: claude
      responses:
        "200":
          description: Instructions body
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Unknown format
          content:
            text/plain:
              schema:
                type: string

  # ── Setup ───────────────────────────────────────────────────────────────
  /v1/admin/setup/status:
    get:
      operationId: getSetupStatus
      tags: [Setup]
      summary: Check if initial setup is complete
      security: []
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"

  /v1/admin/setup:
    post:
      operationId: performSetup
      tags: [Setup]
      summary: Perform initial setup (create first admin account)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Setup complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Setup already complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/setup/onboarding:
    put:
      operationId: updateOnboardingProgress
      tags: [Setup]
      summary: Persist guided onboarding wizard progress
      description: >-
        Saves the onboarding wizard's step cursor and, when complete is true,
        marks the guided first-run flow finished. Administrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingProgressRequest"
      responses:
        "200":
          description: Progress saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          $ref: "#/components/responses/BadRequest"

  # ── Auth ────────────────────────────────────────────────────────────────
  /v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Authenticate with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/lookup:
    post:
      operationId: lookupAuthMethod
      tags: [Auth]
      summary: Check auth method for an email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Auth method lookup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    type: string
                    enum: [local, idp, unknown]

  # ── OAuth Discovery & Flow ─────────────────────────────────────────────
  /.well-known/oauth-authorization-server:
    get:
      operationId: getOAuthMetadata
      tags: [OAuth]
      summary: OAuth 2.0 Authorization Server Metadata (RFC 8414)
      security: []
      responses:
        "200":
          description: Server metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthServerMetadata"

  /.well-known/jwks.json:
    get:
      operationId: getJWKS
      tags: [OAuth]
      summary: JSON Web Key Set for the instance public signing key (RFC 7517)
      description: |
        Serves this deployment's persistent instance public key as a single-key
        JWK Set. The key is an ECDSA P-256 (ES256) public key; the private half
        is never exposed. Used to verify instance-signed JWTs.
      security: []
      responses:
        "200":
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"

  /.well-known/oauth-protected-resource:
    get:
      operationId: getProtectedResourceMetadata
      tags: [OAuth]
      summary: OAuth Protected Resource Metadata (RFC 9728)
      security: []
      responses:
        "200":
          description: Protected resource metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthProtectedResourceMetadata"

  /.well-known/oauth-protected-resource/mcp/{share_id}:
    get:
      operationId: getProtectedResourceMetadataForShare
      tags: [OAuth]
      summary: Path-scoped OAuth Protected Resource Metadata for a per-share connector URL
      description: |
        RFC 9728 §3.1 path-insertion variant. A per-share connector URL
        (`/mcp/{share_id}`) discovers its metadata here; the returned `resource`
        is the per-share URL so the MCP client binds its token to that exact
        path. An unknown or inactive share id returns 404.
      security: []
      parameters:
        - name: share_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Protected resource metadata for the per-share connector URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthProtectedResourceMetadata"
        "404":
          description: No active share with this id

  /authorize:
    post:
      operationId: oauthAuthorizeDecision
      tags: [OAuth]
      summary: Submit the OAuth consent decision
      description: |
        Receives the user's approve/deny decision from the consent page and
        redirects back to the client with an authorization code (on approve)
        or an error. `GET /authorize` serves the consent HTML shell and is not
        modeled here; the page reads its render context from
        `GET /v1/oauth/authorize/context`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, redirect_uri, decision]
              properties:
                client_id:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                response_type:
                  type: string
                  enum: [code]
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                  enum: [S256]
                scope:
                  type: string
                state:
                  type: string
                decision:
                  type: string
                  enum: [approve, deny]
                auth_mode:
                  type: string
                share_token:
                  type: string
      responses:
        "302":
          description: Redirect to redirect_uri with authorization code or error
        "400":
          description: OAuth error response

  /v1/oauth/authorize/context:
    get:
      operationId: getAuthorizeContext
      tags: [OAuth]
      summary: Render context for the OAuth consent page
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: response_type
          in: query
          schema:
            type: string
        - name: code_challenge
          in: query
          schema:
            type: string
        - name: code_challenge_method
          in: query
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
        - name: resource
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Authorization request context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeContextResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/oauth/share/preview:
    post:
      operationId: previewShare
      tags: [OAuth]
      summary: Preview a pasted share secret without consuming it
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharePreviewRequest"
      responses:
        "200":
          description: Share preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharePreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/oauth/authorize/complete:
    post:
      operationId: completeAuthorize
      tags: [OAuth]
      summary: Complete an OAuth approve for a loopback redirect_uri
      description: >
        Loopback-only JSON counterpart to the native form POST /authorize.
        When redirect_uri is a loopback address, the React consent page calls
        this on approve and receives the minted code plus the assembled
        callback URL, then probes the loopback callback server for
        reachability before either forwarding to it or showing a manual
        paste-back screen. Refuses any non-loopback redirect_uri so the code
        is never returned in a readable body to a public web client.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeCompleteRequest"
      responses:
        "200":
          description: Minted code and callback URL, or an access_denied body on deny
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeCompleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/share/accept:
    get:
      operationId: acceptShare
      tags: [OAuth]
      summary: Resolve a share magic-link token into its grants
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Share details and MCP server URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareAcceptResponse"

  /v1/auth/passkey/begin:
    post:
      operationId: passkeyLoginBegin
      tags: [Auth]
      summary: Begin a passkey (WebAuthn) login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: WebAuthn assertion request options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"

  /v1/auth/passkey/finish:
    post:
      operationId: passkeyLoginFinish
      tags: [Auth]
      summary: Finish a passkey (WebAuthn) login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnAssertion"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/idp/login:
    get:
      operationId: idpLogin
      tags: [Auth]
      summary: Begin an IdP (OIDC SSO) login
      security: []
      parameters:
        - name: idp_id
          in: query
          schema:
            type: string
        - name: redirect_to
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the identity provider

  /auth/idp/callback:
    get:
      operationId: idpCallback
      tags: [Auth]
      summary: IdP (OIDC SSO) callback
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect back to the app with a session

  /token:
    post:
      operationId: oauthToken
      tags: [OAuth]
      summary: OAuth token endpoint
      description: |
        Supports client_secret_post and none (public client) authentication methods.
        Confidential clients must include client_secret in the request body.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                code:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                client_id:
                  type: string
                client_secret:
                  type: string
                  description: Required for confidential clients using client_secret_post authentication
                code_verifier:
                  type: string
                refresh_token:
                  type: string
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
      responses:
        "200":
          description: Token response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
        "400":
          description: OAuth error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"

  /register:
    post:
      operationId: oauthRegisterClient
      tags: [OAuth]
      summary: Dynamic Client Registration (RFC 7591)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthClientRegistrationRequest"
      responses:
        "201":
          description: Client registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientRegistrationResponse"
        "400":
          description: Invalid request

  /userinfo:
    get:
      operationId: oauthUserInfo
      tags: [OAuth]
      summary: Get authenticated user info (OpenID Connect subset)
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthUserInfoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Events (SSE) ───────────────────────────────────────────────────────
  # ── Project-Scoped Memories ─────────────────────────────────────────────
  /v1/projects/{project_id}/memories:
    post:
      operationId: storeMemory
      tags: [Memories]
      summary: Store a new memory
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreMemoryRequest"
      responses:
        "201":
          description: Memory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreMemoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    get:
      operationId: listMemories
      tags: [Memories]
      summary: List memories with pagination
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated memory list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMemories"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/projects/{project_id}/memories/{id}:
    get:
      operationId: getMemory
      tags: [Memories]
      summary: Get a single memory by ID
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/MemoryId"
      responses:
        "200":
          description: Memory detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateMemory
      tags: [Memories]
      summary: Update a memory
      description: |
        Tag-only and metadata-only updates mutate the row in place; the
        response `id` matches the path id.

        A content change splits the memory thread: a NEW memory row is
        created with the new content, the old row is marked
        `superseded_by = new id`, and the response `id` is the new (active)
        id. The old row's enrichment (entities, relationships, embedding,
        accumulated weights) stays attached to the old id and is reachable
        via `include_superseded=true` reads. `previous_memory_id` echoes
        the path id so callers correlating events or webhooks can map
        old → new without inspecting the lineage table. `superseded=true`
        on the response indicates the chain link was created. The forget
        cascade walks `superseded_by` so deleting the active head also
        deletes older versions of the same thread.

        Returning the new id on a content change is a breaking change
        from the prior in-place behavior; callers that hold the path id
        for follow-up reads must use `response.id` instead.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemoryRequest"
      responses:
        "200":
          description: Memory updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateMemoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteMemory
      tags: [Memories]
      summary: Soft-delete a single memory
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/MemoryId"
      responses:
        "200":
          description: Memory deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgetResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/projects/{project_id}/memories/batch:
    post:
      operationId: batchStoreMemories
      tags: [Memories]
      summary: Store multiple memories in batch
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchStoreRequest"
      responses:
        "201":
          description: Batch store result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchStoreResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/projects/{project_id}/memories/get:
    post:
      operationId: batchGetMemories
      tags: [Memories]
      summary: Retrieve multiple memories by ID
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
      responses:
        "200":
          description: Batch get result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/projects/{project_id}/memories/recall:
    post:
      operationId: recallMemories
      tags: [Memories]
      summary: Semantic memory recall (vector search + ranking)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecallRequest"
      responses:
        "200":
          description: Recall results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/projects/{project_id}/memories/ask:
    post:
      operationId: askProjectMemories
      tags: [Memories]
      summary: Synthesize one answer over a project's memories (ask tool)
      description: >-
        Gated behind the ask.enabled feature flag; returns 404 when the feature
        is disabled. Scopes the synthesis to this project plus the global and
        about_me tiers.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: Synthesized answer with cited sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The ask synthesis provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/projects/{project_id}/memories/forget:
    post:
      operationId: bulkForgetMemories
      tags: [Memories]
      summary: Bulk delete memories by IDs or tags
      parameters:
        - $ref: "#/components/parameters/ProjectId"
